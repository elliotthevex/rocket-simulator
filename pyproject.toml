[project]
name = "rocket-sim"
version = "0.1.0"
description = "A combustion-focused solid rocket motor and flight simulator."
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rocket-sim = "rocket_sim.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rocket_sim*"]
